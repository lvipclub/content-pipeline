<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=1080,height=1350">
<style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden;font-family:'Inter','Segoe UI',system-ui,sans-serif}
.badge{display:inline-block;font-size:12px;padding:4px 14px;border-radius:99px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.slide-num{position:absolute;top:32px;right:32px;font-size:11px;font-family:monospace;letter-spacing:.15em;text-transform:uppercase}
.accent-bar-top{position:absolute;top:0;left:0;width:100%;height:4px}
.accent-bar-bottom{position:absolute;bottom:0;left:0;width:100%;height:2px;background:linear-gradient(90deg,#7EBEC540,#7EBEC5,#7EBEC540)}

</style></head><body>
<div style="background:linear-gradient(180deg,#0a1628,#112240,#0a1628);width:1080px;height:1350px;position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:64px 48px">
<div class="accent-bar-top" style="background:#7EBEC5"></div>
<div class="slide-num" style="color:rgba(126,190,197,.3)color:rgba(126,190,197,.3)">Slide 1 / 5</div>
<div style="margin-bottom:32px"><span class="badge" style="background:rgba(126,190,197,.2);color:#7EBEC5;border:1px solid rgba(126,190,197,.3)">Hook</span></div>
<h1 style="font-family:'Trebuchet MS',Trebuchet,Helvetica,Arial,sans-serif;font-size:52px;font-weight:800;color:#fff;line-height:1.15;margin-bottom:24px;max-width:900px">Your AHU coil determines efficiency and comfort</h1>
<p style="font-size:20px;color:rgba(255,255,255,.55);max-width:560px">Coil selection impacts thermal comfort, energy efficiency, and the service life of the entire HVAC system.</p>
<div class="accent-bar-bottom"></div>
</div></body></html>
